name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Only needed by `prisma validate`; nothing connects to it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx tsc --noEmit

  build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # The build tolerates a missing database (pages are prerendered empty and
      # refreshed by POST /api/revalidate after deploy), so no service container is needed.
      NEXT_PUBLIC_SITE_URL: https://quin.yosuaf.com
      ROBOTS_NOINDEX: 'true'
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build